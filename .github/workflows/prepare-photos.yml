name: Prepare FleetOps car photos
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-vehicle-photos.py'
      - '.github/workflows/prepare-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fleetops-photos
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimization dependency
        run: python -m pip install Pillow
      - name: Verify licenses and prepare bundled photos
        run: python scripts/prepare-vehicle-photos.py
      - name: Save photos to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vehicle-photos
          git diff --cached --quiet && exit 0
          git commit -m "assets: bundle verified representative vehicle photographs"
          git push origin HEAD:main
